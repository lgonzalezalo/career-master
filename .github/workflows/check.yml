name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-crosextra-carlito
          pip install pyyaml pypdf markdown playwright
          python -m playwright install --with-deps chromium
      - name: Run checks
        run: python tools/check.py
